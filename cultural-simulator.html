<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatTheFad? · Cultural Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-display: 'Playfair Display', Georgia, serif;
  --font-mono: 'DM Mono', 'Courier New', monospace;
  --mw-topbar-h: 56px;
}
/* Light = Stories parchment (Sincewhen Stories standalone palette) */
[data-theme="light"] {
  --bg: #F0EDE2;
  --text: #1A1A17;
  --text-dim: #65645B;
  --surface: #E6E2D2;
  --surface-2: #DCD7C2;
  --border: #C8C2AD;
  --signal: #4F5728;
  --signal-soft: rgba(79,87,40,0.10);
  --counter: #1A6EA8;
  --science: #7048C0;
  --social: #C45C1A;
  --economic: #C49A12;
  --platform: #1A6EA8;
  --cultural: #1D9E75;
  --counter-node: #8A8578;
}
/* Dark = Field Record espresso ground, verdigris accent */
[data-theme="dark"] {
  --bg: #1B150D;
  --text: #F2EEE4;
  --text-dim: #B8AC97;
  --surface: #241D13;
  --surface-2: #2B2318;
  --border: #3A3025;
  --signal: #5FA891;
  --signal-soft: rgba(95,168,145,0.12);
  --counter: #6E86E0;
  --science: #9B7EE0;
  --social: #D96A48;
  --economic: #D9A94E;
  --platform: #6E86E0;
  --cultural: #2E9C74;
  --counter-node: #8A7F6B;
}
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
}
body { overflow-y: auto; }
#root { min-height: 100vh; width: 100%; }
input[type="range"] { accent-color: var(--signal); }
button { font-family: var(--font-mono); }
a { color: inherit; text-decoration: none; }

/* ── Page shell ─────────────────────────────────────────── */
.mw-page { min-height: 100vh; background: var(--bg); color: var(--text); }

.mw-topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  height: var(--mw-topbar-h);
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.mw-wordmark {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  color: var(--signal); letter-spacing: -0.5px; flex-shrink: 0;
}
.mw-input-wrap { flex: 1; max-width: 560px; position: relative; }
.mw-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 84px 9px 14px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.mw-input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.mw-input::placeholder { color: var(--text-dim); }
.mw-kind-pill {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px;
  padding: 2px 7px; border-radius: 3px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--signal);
}
.mw-kind-pill[data-kind="question"]   { color: var(--science); }
.mw-kind-pill[data-kind="historical"] { color: var(--platform); }
.mw-stage-pill {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--signal);
  padding: 4px 12px; border: 1px solid var(--signal); border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
}
.mw-topbar-spacer { flex: 1; }
.mw-link {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-dim); border-bottom: 1px solid var(--border);
  padding-bottom: 2px; transition: color 0.15s, border-color 0.15s;
}
.mw-link:hover { color: var(--signal); border-bottom-color: var(--signal); }
.mw-icon-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text-dim); width: 32px; height: 32px; border-radius: 4px;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.mw-icon-btn:hover { color: var(--text); border-color: var(--text-dim); }

/* ── Stage bar (sticky scrubber) ─────────────────────────── */
.mw-stagebar {
  position: sticky; top: var(--mw-topbar-h); z-index: 40;
  padding: 10px 24px 6px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.mw-stagebar-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
}
.mw-pb-btn {
  background: var(--surface); border: 1px solid var(--border);
  width: 30px; height: 30px; border-radius: 4px; cursor: pointer;
  color: var(--text-dim); font-size: 12px; font-family: var(--font-mono);
  flex-shrink: 0;
}
.mw-pb-btn.active { color: var(--signal); }

/* ── Main content ────────────────────────────────────────── */
.mw-main {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 24px 120px;
  display: flex; flex-direction: column; gap: 32px;
}

.mw-section { display: flex; flex-direction: column; gap: 14px; }
.mw-section-head {
  font-family: var(--font-mono);
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-dim);
}
.mw-section.two-col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch;
}
.mw-section.map-grid {
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: stretch;
}

/* ── Hero ─────────────────────────────────────────────────── */
.mw-hero { display: flex; flex-direction: column; gap: 14px; }
.mw-display {
  font-family: var(--font-display); font-size: 36px; font-weight: 700;
  letter-spacing: -0.4px; color: var(--text); line-height: 1.1;
}
.mw-blurb {
  font-family: var(--font-display); font-style: italic;
  font-size: 17px; color: var(--text-dim); line-height: 1.45; max-width: 820px;
}
.mw-one-line {
  font-family: var(--font-display); font-style: italic;
  font-size: 14px; color: var(--text-dim); line-height: 1.55; max-width: 820px;
  border-left: 2px solid var(--border); padding-left: 12px;
}
.mw-hero-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: stretch;
}
.mw-var-row {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 4px;
}

/* ── Report card (mirrors index.html) ────────────────────── */
.report-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex; flex-direction: column;
  min-width: 0;
}
.rc-head {
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.rc-head.with-actions {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.rc-body {
  padding: 14px 16px;
  flex: 1; min-height: 0;
}
.rc-body.no-pad { padding: 0; }
.rc-body.legend-body { padding: 0; max-height: 540px; overflow: auto; }
.rc-body.globe-body { min-height: 460px; display: flex; padding: 0; }
.rc-body.globe-body > * { flex: 1; }

/* Sim hero card */
.mw-sim-card > .rc-body { padding: 0; }
.mw-sim-stage {
  aspect-ratio: 520 / 340;
  width: 100%;
  min-height: 0;
  background: var(--surface-2);
}
.mw-sim-stage > * { width: 100%; height: 100%; display: block; }

/* Variation tabs */
.mw-var-tabs {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-family: var(--font-mono);
}
.mw-var-tabs button {
  background: none; border: none; cursor: pointer;
  padding: 6px 10px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  font-family: var(--font-mono);
}
.mw-var-tabs button:hover { color: var(--text); }
.mw-var-tabs button[data-active="true"] {
  color: var(--signal); border-bottom-color: var(--signal);
}
.mw-var-tabs .mw-all-toggle {
  margin-left: auto;
  font-size: 10px; color: var(--text-dim);
  background: none; border: none; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
  font-family: var(--font-mono);
}
.mw-var-tabs .mw-all-toggle:hover { color: var(--signal); }

/* Toggle group (globe/flat etc.) */
.mw-toggle-group { display: flex; gap: 2px; }
.mw-toggle-group button {
  padding: 4px 10px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  background: var(--surface-2);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer;
  font-family: var(--font-mono);
}
.mw-toggle-group button[data-active="true"] {
  background: var(--signal); color: white; border-color: var(--signal);
}

/* Deck (rules + canon) */
.mw-deck {
  border-top: 1px dashed var(--border);
  padding-top: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.mw-deck-toggle {
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-family: var(--font-mono);
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  align-self: flex-start;
  padding: 4px 0;
}
.mw-deck-toggle:hover { color: var(--signal); }
.mw-deck-body { display: flex; flex-direction: column; gap: 14px; }

/* Rules row */
.mw-rules-row {
  display: flex; align-items: center; gap: 20px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  flex-wrap: wrap;
}
.mw-rules-label {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-dim);
}
.mw-rule-slider { display: flex; flex-direction: column; gap: 3px; flex: 1 1 160px; }
.mw-rule-slider-row { display: flex; justify-content: space-between; font-size: 10px; }
.mw-rule-slider-row .lbl { color: var(--text-dim); }
.mw-rule-slider-row .val { color: var(--text); font-family: var(--font-mono); }
.mw-counter-mode { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
.mw-counter-mode .mw-pill-group { display: flex; gap: 4px; }
.mw-counter-mode button {
  flex: 1; padding: 4px 6px;
  font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  font-family: var(--font-mono);
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 3px; cursor: pointer;
}
.mw-counter-mode button[data-active="true"] {
  background: var(--counter); color: white; border-color: var(--counter);
}

/* Canon picker — horizontal scroll */
.mw-canon-row {
  display: flex; gap: 8px; align-items: center;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scrollbar-width: thin;
}
.mw-canon-row::-webkit-scrollbar { height: 6px; }
.mw-canon-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.mw-canon-row > .label {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-dim); flex-shrink: 0;
}
.mw-canon-pill {
  flex-shrink: 0;
  font-size: 11px; font-family: var(--font-mono);
  padding: 5px 12px; border-radius: 3px; cursor: pointer;
  background: transparent; border: 1px solid var(--signal); color: var(--signal);
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.mw-canon-pill[data-kind="historical"] { border-color: var(--platform); color: var(--platform); }
.mw-canon-pill[data-kind="question"]   { border-color: var(--science);  color: var(--science); }
.mw-canon-pill[data-active="true"][data-kind="current"]    { background: var(--signal);   color: white; }
.mw-canon-pill[data-active="true"][data-kind="historical"] { background: var(--platform); color: white; }
.mw-canon-pill[data-active="true"][data-kind="question"]   { background: var(--science);  color: white; }

/* Scrubber */
.mw-scrubber-wrap { flex: 1; position: relative; min-width: 0; }
.mw-scrubber-track { position: relative; height: 24px; }
.mw-scrubber-track .bar {
  position: absolute; left: 0; right: 0; top: 11px;
  height: 2px; background: var(--border); border-radius: 1px;
}
.mw-scrubber-track .fill {
  position: absolute; left: 0; top: 11px; height: 2px;
  background: var(--signal); border-radius: 1px;
}
.mw-scrubber-track .tick {
  position: absolute; top: 0; text-align: center; transform: translateX(-50%);
}
.mw-scrubber-track .tick .dot {
  margin: 9px auto; width: 6px; height: 6px; border-radius: 50%;
  background: var(--surface-2); border: 1.5px solid var(--border);
}
.mw-scrubber-track .tick.active .dot,
.mw-scrubber-track .tick.past .dot { background: var(--signal); border-color: var(--signal); }
.mw-scrubber-track .tick.active .dot { width: 10px; height: 10px; margin: 7px auto; }
.mw-scrubber-range {
  width: 100%; margin-top: -20px; position: relative; z-index: 2;
  background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none; height: 24px;
}
.mw-scrubber-labels {
  display: flex; justify-content: space-between; margin-top: 2px;
  font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); font-family: var(--font-mono);
}
.mw-scrubber-labels > span.active { color: var(--signal); }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 1100px) {
  .mw-hero-grid { grid-template-columns: 1fr; }
}
@media (max-width: 1000px) {
  .mw-section.map-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .mw-section.two-col { grid-template-columns: 1fr; }
  .mw-var-row { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .mw-topbar { gap: 10px; padding: 0 14px; }
  .mw-stage-pill { display: none; }
  .mw-main { padding: 20px 14px 80px; gap: 24px; }
  .mw-display { font-size: 28px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// Theme — match index.html's localStorage key so both pages agree.
(function () {
  const stored = localStorage.getItem('whatthefad_theme');
  if (stored === 'dark' || stored === 'light') {
    document.documentElement.setAttribute('data-theme', stored);
  }
})();
</script>

<script type="text/babel" src="sim/trends-data.jsx"></script>
<script type="text/babel" src="sim/ca-engine.jsx"></script>
<script type="text/babel" src="sim/variation-a.jsx"></script>
<script type="text/babel" src="sim/variation-b.jsx"></script>
<script type="text/babel" src="sim/variation-c.jsx"></script>
<script type="text/babel" src="sim/chrome.jsx"></script>
<script type="text/babel" src="sim/panels.jsx"></script>
<script type="text/babel" src="sim/ink-legend.jsx"></script>
<script type="text/babel" src="sim/geo-data.jsx"></script>
<script type="text/babel" src="sim/world-land.jsx"></script>
<script type="text/babel" src="sim/globe.jsx"></script>
<script type="text/babel" src="sim/demo-drilldown.jsx"></script>
<script type="text/babel" src="sim/app.jsx"></script>
</body>
</html>
